onboarding = false
# herdr configuration
# Keybindings ported from ~/.tmux.conf

# [theme]
# name = "catppuccin"
# # Follow the host terminal's light/dark appearance.
# auto_switch = true
# dark_name = "catppuccin"          # mocha
# light_name = "catppuccin-latte"

[keys]
# tmux: set -g prefix C-s
prefix = "ctrl+b"

# tmux: christoomey/vim-tmux-navigator — move between panes with ctrl+h/j/k/l,
# no prefix needed. (tmux also had prefix h/j/k/l via bind-key select-pane.)

# tmux: bind % split-window -h  (side-by-side panes, vertical divider)
split_vertical = "prefix+|"
# tmux: bind '"' split-window -v  (stacked panes, horizontal divider)
split_horizontal = 'prefix+_'
# tmux: bind c new-window
new_tab = "ctrl+t"

new_workspace = "prefix+n"

next_workspace = "alt+n"
previous_workspace = "alt+p"

switch_tab = "alt+1..9"

# toggle_sidebar = "alt+e"

# Notes on non-binding tmux settings (already herdr defaults, no config needed):
#   set -g mouse on                -> [ui] mouse_capture = true (default)
#   set-window-option mode-keys vi -> navigate mode uses h/j/k/l by default

[ui.toast]
delivery = "system"

# [ui]
# host_cursor = "native"

[theme]
name = "vesper"
auto_switch = false


[[keys.command]]
key = "alt+e"
type = "plugin_action"
command = "beyondlex.herdr-recent-navigator.focus-workspaces"
description = "Open Navigator: Workspace"


# Optional: Focus Tabs/Panes/Agents when open navigator
[[keys.command]]
key = "alt+i"
type = "plugin_action"
command = "beyondlex.herdr-recent-navigator.focus-tabs"
description = "Open Navigator: Tab"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "beyondlex.herdr-recent-navigator.focus-panes"
description = "Open Navigator: Pane"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "beyondlex.herdr-recent-navigator.focus-agents"
description = "Open Navigator: Agent"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "beyondlex.herdr-recent-navigator.focus-previous-tab"
description = "Jump to previous tab"

[[keys.command]]
key = "alt+y"
type = "plugin_action"
command = "beyondlex.herdr-recent-navigator.focus-previous-pane"
description = "Jump to previous pane"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "beyondlex.herdr-recent-navigator.focus-previous-agent"
description = "Jump to previous agent"
